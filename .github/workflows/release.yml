# Builds the tarball from a version tag and publishes it as a GitHub release
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # for a tag pushed before this workflow existed
    inputs:
      tag:
        description: Existing tag, e.g. v1.0.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - name: Take the version from the tag
        run: npm version --no-git-tag-version --allow-same-version "${TAG#v}"
      - run: npm pack
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release made in the web UI creates the tag too, so it is there already and only gets the tarball
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" webp-lossless-*.tgz
          else
            gh release create "$TAG" webp-lossless-*.tgz --verify-tag --title "$TAG" --generate-notes
          fi
